[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-monitor"
version = "0.1.0"
description = "A modular foundation for collecting investment information."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["xlrd>=2.0,<3", "argon2-cffi>=23.1"]

[project.scripts]
investment-monitor = "investment_monitor.cli:main"
investment-monitor-web = "investment_monitor.web:main"
investment-monitor-refresh-universes = "investment_monitor.universe.daily_refresh:main"
edinet = "investment_monitor.sources.edinet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investment_monitor = ["migrations/*.sql", "web_static/*.html", "web_static/*.css", "web_static/*.js", "universe/*.json"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
