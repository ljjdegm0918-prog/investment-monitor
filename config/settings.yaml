database_path: ../data/investment_monitor.sqlite3
sources:
  - name: sec
    label: SEC EDGAR
    source_type: filings   # config type; stored items use 'regulatory_filing'
    enabled: true
  - name: dart
    label: OpenDART
    source_type: filings
    enabled: true          # requires DART_API_KEY; degrades to Not connected without it
  - name: kind
    label: KIND (KRX)
    source_type: filings
    enabled: true          # key-free public disclosure search
  - name: companies_house
    label: Companies House
    source_type: filings
    enabled: true          # requires COMPANIES_HOUSE_API_KEY; statutory filings, not RNS
  - name: investegate
    label: Investegate
    source_type: filings
    enabled: true          # RNS-class public mirror; page scrape, may break without notice
  - name: hkexnews
    label: HKEXnews (HKEX)
    source_type: filings
    enabled: true          # key-free HKEXnews announcement search; unofficial page API, may change without notice
  - name: hkex_di
    label: Disclosure of Interests (HKEX)
    source_type: filings
    enabled: false         # default off: legacy archive 2003-2017 only; enable explicitly for historical backfill
  - name: news
    label: News
    source_type: news
    enabled: true          # requires FINNHUB_API_KEY; degrades to Not connected without it
  - name: naver_news
    label: Naver Finance
    source_type: news
    enabled: true          # key-free public page scrape; may break without notice
  - name: hankyung
    label: Hankyung
    source_type: news
    enabled: false         # stock news endpoint returned 403/404 from current network
  - name: thebell
    label: TheBell
    source_type: news
    enabled: false         # stock news endpoint returned soft 404 from current network
  - name: yahoo_uk
    label: Yahoo Finance UK
    source_type: news
    enabled: true          # key-free public RSS; may break without notice
  - name: yahoo_hk
    label: Yahoo Finance HK
    source_type: news
    enabled: true          # key-free public RSS mirror; may be loosely related / break without notice
  - name: yahoo_ca
    label: Yahoo Finance CA
    source_type: news
    enabled: true          # key-free public RSS mirror; may be loosely related / break without notice
  - name: google_news_ca
    label: Google News (CA)
    source_type: news
    enabled: true          # key-free Google News RSS search; may be loosely related / break without notice
  # Canada disclosure / extra boards — deliberately not wired (CA-1/CA-4 spike):
  # SEDAR+ has no stable free public API (Radware 403 to stdlib clients);
  # CSE directory TLS handshake fails; NEO origin times out (Cloudflare 522).
  # Listed here so Settings shows Not implemented instead of pretending coverage.
  - name: sedar_plus
    label: SEDAR+ (not wired)
    source_type: filings
    enabled: false
  - name: cse_filings
    label: CSE filings (not wired)
    source_type: filings
    enabled: false
  - name: neo_filings
    label: NEO filings (not wired)
    source_type: filings
    enabled: false
  - name: twse_material
    label: TWSE OpenAPI (material)
    source_type: filings
    enabled: true          # key-free TWSE OpenAPI material-information; listed companies only; OTC via tpex_material; 興櫃 not wired
  - name: tpex_material
    label: TPEx OpenAPI (material)
    source_type: filings
    enabled: true          # key-free TPEx OpenAPI material-information; OTC (上櫃); 興櫃 not covered yet
  - name: yahoo_tw
    label: Yahoo Finance TW
    source_type: news
    enabled: true          # key-free public RSS mirror; may be loosely related / break without notice
  - name: google_news_tw
    label: Google News (TW)
    source_type: news
    enabled: true          # key-free Google News RSS search; may be loosely related / break without notice
  - name: asx_announcements
    label: ASX Market Announcements
    source_type: filings
    enabled: true          # key-free ASX site research API (undocumented; may change; latest 5 per company)
  - name: yahoo_au
    label: Yahoo Finance AU
    source_type: news
    enabled: true          # key-free public RSS mirror; may be loosely related / break without notice
  - name: google_news_au
    label: Google News (AU)
    source_type: news
    enabled: true          # key-free Google News RSS search; may be loosely related / break without notice
  - name: amf_oam
    label: AMF OAM
    source_type: filings
    enabled: true          # key-free AMF OAM information feed (undocumented; may change without notice)
  - name: fsma_stori
    label: FSMA STORI
    source_type: filings
    enabled: true          # key-free official FSMA STORI (Belgian central storage of regulated information); needs a BE ISIN (typed or from the BE universe) to match
  # Belgium second disclosure - deliberately not wired (BE-4 re-verified 2026-08-10):
  # Euronext Brussels announcements are Drupal HTML pages keyed by per-company
  # node IDs (no RSS, no JSON export; _format=json -> 406); the key-free EQS News
  # JSON API returns zero records for sampled Belgian ISINs (incl. BEL 20 names);
  # paid feeds (Euronext Web Services/Saturn, FinancialReports.eu, LSEG) excluded.
  - name: be_second_disclosure
    label: BE second disclosure (not wired)
    source_type: filings
    enabled: false
  - name: cnmv_hr
    label: CNMV (hechos relevantes)
    source_type: filings
    enabled: true          # key-free official CNMV RSS (IP + OIR); needs universe name/ISIN to match
  - name: bme_relevant_facts
    label: BME Relevant Facts
    source_type: filings
    enabled: true          # key-free official BME relevant-facts JSON; needs universe company key; ~31 day range cap
  # Singapore disclosure - deliberately not wired (SG-1 spike A3):
  # SGX company announcements are a JS SPA; api.sgx.com routes return 403
  # (undocumented AWS Gateway, no stable free list endpoint), the legacy
  # infopub.sgx.com SGXNet JSON is retired (TLS handshake fails), and
  # links.sgx.com only serves per-announcement deep links/PDFs. MAS/ACRA
  # have no stable key-free per-issuer announcement feed.
  - name: sgx_announcements
    label: SGX announcements (not wired)
    source_type: filings
    enabled: false
  - name: yahoo_fr
    label: Yahoo Finance FR
    source_type: news
    enabled: true          # key-free public RSS mirror (fr-FR + en-US); may be loosely related / break without notice
  - name: google_news_fr
    label: Google News (FR)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=fr); may be loosely related / break without notice
  - name: eqs_dgap
    label: EQS News (DGAP)
    source_type: filings
    enabled: true          # key-free EQS News JSON (ex-DGAP); unofficial WP API; may change without notice
  - name: yahoo_de
    label: Yahoo Finance DE
    source_type: news
    enabled: true          # key-free public RSS mirror (de-DE + en-US); may be loosely related / break without notice
  - name: google_news_de
    label: Google News (DE)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=de); may be loosely related / break without notice
  - name: yahoo_nl
    label: Yahoo Finance NL
    source_type: news
    enabled: true          # key-free public RSS mirror (nl-NL + en-US); may be loosely related / break without notice
  - name: google_news_nl
    label: Google News (NL)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=nl); may be loosely related / break without notice
  - name: eqs_nl
    label: EQS News (NL)
    source_type: filings
    enabled: true          # key-free EQS News JSON by NL ISIN (unofficial; partial Dutch coverage; not AFM official); needs ISIN from universe or typed ISIN
  - name: eqs_it
    label: EQS News (IT)
    source_type: filings
    enabled: true          # key-free EQS News JSON by IT ISIN (unofficial; partial Italian coverage; not Consob official); needs ISIN from universe or typed ISIN
  - name: yahoo_it
    label: Yahoo Finance IT
    source_type: news
    enabled: true          # key-free public RSS mirror (it-IT + en-US); may be loosely related / break without notice
  - name: google_news_it
    label: Google News (IT)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=it); may be loosely related / break without notice
  - name: yahoo_es
    label: Yahoo Finance ES
    source_type: news
    enabled: true          # key-free public RSS mirror (es-ES + en-US); may be loosely related / break without notice
  - name: google_news_es
    label: Google News (ES)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=es); may be loosely related / break without notice
  - name: yahoo_sg
    label: Yahoo Finance SG
    source_type: news
    enabled: true          # key-free public RSS mirror (en-SG + en-US); may be loosely related / break without notice
  - name: google_news_sg
    label: Google News (SG)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=en-SG); may be loosely related / break without notice
  - name: yahoo_be
    label: Yahoo Finance BE
    source_type: news
    enabled: true          # key-free public RSS mirror (region=BE, fr-BE + en-US merged; identical titles stay single-language); may be loosely related / break without notice
  - name: google_news_be
    label: Google News (BE)
    source_type: news
    enabled: true          # key-free Google News RSS search (hl=en-BE); may be loosely related / break without notice
  # Germany second disclosure — deliberately not wired (DE-4):
  # Unternehmensregister / BaFin HTML portals have no stable free JSON for
  # issuer filings; EQS News is the only wired DE disclosure source.
  - name: community
    label: Community
    source_type: community
    enabled: false
  - name: research
    label: Research
    source_type: research
    enabled: false
  - name: tdnet_public_web
    label: TDnet (JPX public page)
    source_type: regulatory_disclosure
    enabled: true           # official JPX pages; operator permission confirmed in .env
  - name: edinet
    label: EDINET
    source_type: regulatory_disclosure
    enabled: true           # degrades to Not connected until EDINET_API_KEY is configured
